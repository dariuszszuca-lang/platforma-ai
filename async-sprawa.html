<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <title>Sprawa Async | AI-Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,300..600;9..144,1,300..600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/main.css">
  <style>
    .case-shell { min-height: 100vh; display: grid; align-items: center; padding: 52px 0; }
    .case-card { max-width: 860px; margin: 0 auto; background: #fff; border: 1px solid var(--line); padding: 34px; box-shadow: 0 24px 80px rgba(28,25,23,0.12); }
    .case-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; border-bottom: 1px solid var(--line); padding-bottom: 22px; margin-bottom: 24px; }
    .case-title { font-family: 'Fraunces', Georgia, serif; font-size: clamp(34px, 5vw, 58px); font-weight: 400; line-height: 1.04; letter-spacing: 0; margin-top: 12px; }
    .case-pill { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; border: 1px solid var(--line); padding: 9px 11px; color: var(--copper); white-space: nowrap; }
    .case-answer { background: var(--cream-soft); border-left: 4px solid var(--copper); padding: 22px; margin-top: 22px; color: var(--ink); }
    .case-answer p { white-space: pre-wrap; margin: 0; color: var(--ink-soft); }
    .case-link { display: inline-flex; margin-top: 16px; color: var(--copper); font-weight: 700; }
    .case-loading, .case-error { color: var(--ink-soft); }
    @media (max-width: 700px) { .container { padding: 0 22px; } .case-card { padding: 24px; } .case-top { flex-direction: column; } }
  </style>
<link rel="canonical" href="https://ai-team.pl/async-sprawa">
</head>
<body>
  <main class="case-shell">
    <div class="container">
      <article class="case-card">
        <div class="case-top">
          <div>
            <a class="brand" href="/" style="margin-bottom:24px;">
              <img class="logo-mark" src="/assets/ai-team-logo-256.png" alt="AI-Team" width="42" height="42" style="border-radius:50%;display:block">
              <span class="wordmark">AI · <em>Team</em></span>
            </a>
            <span class="label-mono">Prywatny link sprawy</span>
            <h1 class="case-title" id="caseTitle">Ładuję sprawę...</h1>
          </div>
          <div class="case-pill" id="caseStatus">status</div>
        </div>
        <div id="caseContent" class="case-loading">Sprawdzam link i pobieram aktualny status.</div>
      </article>
    </div>
  </main>

  <script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || '';
    const key = params.get('key') || '';
    const titleEl = document.getElementById('caseTitle');
    const statusEl = document.getElementById('caseStatus');
    const contentEl = document.getElementById('caseContent');

    const labels = {
      new: 'nowe',
      triage: 'w analizie',
      waiting: 'czeka na dane',
      answered: 'odpowiedziane',
      closed: 'zamknięte'
    };

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = String(str || '');
      return div.innerHTML;
    }

    function formatDate(value) {
      const date = new Date(value);
      if (isNaN(date)) return '—';
      return date.toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    async function loadCase() {
      if (!id || !key) {
        titleEl.textContent = 'Brak danych sprawy';
        statusEl.textContent = 'błąd';
        contentEl.className = 'case-error';
        contentEl.textContent = 'Ten link jest niepełny. Wróć do wiadomości z potwierdzeniem zgłoszenia.';
        return;
      }

      try {
        const response = await fetch('/api/async-case?id=' + encodeURIComponent(id) + '&key=' + encodeURIComponent(key));
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.ok) throw new Error(result.error || 'Nie udało się pobrać sprawy.');

        const item = result.case;
        titleEl.textContent = item.title || 'Sprawa Async';
        statusEl.textContent = labels[item.status] || item.status || 'nowe';

        if (item.has_answer) {
          contentEl.className = '';
          contentEl.innerHTML = [
            '<p class="body">Sprawa dodana: ' + esc(formatDate(item.created_at)) + '</p>',
            '<div class="case-answer">',
            '<span class="label-mono">Odpowiedź Darka</span>',
            item.response_text ? '<p style="margin-top:12px;">' + esc(item.response_text) + '</p>' : '',
            item.response_url ? '<a class="case-link" href="' + esc(item.response_url) + '" target="_blank" rel="noopener">Otwórz materiał / nagranie →</a>' : '',
            '</div>'
          ].join('');
        } else {
          contentEl.className = '';
          contentEl.innerHTML = '<p class="body-lg">Sprawa jest zapisana. Odpowiedź pojawi się tutaj po analizie.</p><p class="body" style="margin-top:14px;">Ostatnia aktualizacja: ' + esc(formatDate(item.updated_at || item.created_at)) + '</p>';
        }
      } catch (error) {
        titleEl.textContent = 'Nie mogę otworzyć sprawy';
        statusEl.textContent = 'błąd';
        contentEl.className = 'case-error';
        contentEl.textContent = error.message || 'Błąd odczytu.';
      }
    }

    loadCase();
  })();
  </script>
</body>
</html>
