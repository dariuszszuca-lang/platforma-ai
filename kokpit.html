<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Kokpit Finansowy</title>
<meta name="description" content="Całe Twoje finanse na jednym ekranie — portfolio, cele, scenariusze, wydatki.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111726'/%3E%3Crect x='7' y='16' width='4' height='9' rx='1.5' fill='%234f7cff'/%3E%3Crect x='14' y='11' width='4' height='14' rx='1.5' fill='%23a855f7'/%3E%3Crect x='21' y='7' width='4' height='18' rx='1.5' fill='%2334d399'/%3E%3C/svg%3E">
</head><body>
<style>
:root{
  --bg:#070b14; --bg-2:#0a0f1c; --surface:#111726; --surface-2:#161d2e; --surface-3:#1c2437;
  --line:#212a3e; --line-2:#2a3550;
  --ink:#eef2fb; --muted:#8b96ad; --faint:#5e6a83;
  --blue:#4f7cff; --blue-2:#3b6fff; --blue-soft:#6b8fff; --blue-bg:rgba(79,124,255,.14);
  --violet:#a855f7; --violet-2:#8b5cf6; --violet-bg:rgba(168,85,247,.14);
  --pos:#34d399; --neg:#f26d7d; --gold:#d6a13c;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --r:18px; --r-sm:12px; --side:248px;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 50px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#eef1f7; --bg-2:#e7ebf3; --surface:#ffffff; --surface-2:#f4f6fb; --surface-3:#eaeef6;
  --line:#e0e5ef; --line-2:#d3dae8;
  --ink:#131a2a; --muted:#5c6577; --faint:#8b93a6;
  --blue:#3b6fff; --blue-2:#2f62f0; --blue-soft:#5a83ff; --blue-bg:rgba(59,111,255,.10);
  --violet:#8b5cf6; --violet-2:#7c3aed; --violet-bg:rgba(139,92,246,.10);
  --pos:#12a86b; --neg:#e0475a; --gold:#b8862a;
  --shadow:0 1px 2px rgba(16,22,31,.05),0 12px 36px rgba(16,22,31,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
svg.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}

/* sidebar */
.side{background:var(--bg-2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.logo .mk{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--violet));display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;box-shadow:0 6px 18px rgba(79,124,255,.4)}
.logo .nm{font-weight:700;font-size:15px;line-height:1.15;letter-spacing:-.01em}
.navi{display:flex;flex-direction:column;gap:3px;flex:1}
.navi button{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:12px;color:var(--muted);font-size:14.5px;font-weight:550;transition:.15s;text-align:left;width:100%}
.navi button:hover{color:var(--ink);background:var(--surface)}
.navi button.on{color:#fff;background:linear-gradient(100deg,var(--blue),var(--blue-2));box-shadow:0 8px 22px rgba(79,124,255,.35)}
:root[data-theme="light"] .navi button.on{color:#fff}
.premium{margin-top:10px;background:linear-gradient(150deg,var(--violet-bg),transparent);border:1px solid var(--line);border-radius:16px;padding:15px}
.premium .h{display:flex;align-items:center;gap:9px;font-weight:650;font-size:13.5px}
.premium .h .sp{color:var(--violet)}
.premium p{margin:7px 0 12px;font-size:12px;color:var(--muted)}
.premium .act{width:100%;justify-content:center;display:flex;align-items:center;gap:7px;padding:9px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--violet);font-weight:600;font-size:13px}
.premium .act:hover{background:var(--violet-bg)}
.user{margin-top:8px;display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:14px}
.user .av{width:34px;height:34px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--muted)}
.user .un{font-weight:600;font-size:13.5px}.user .ur{font-size:11.5px;color:var(--faint)}
.user .tg{margin-left:auto;color:var(--muted);width:32px;height:32px;display:grid;place-items:center;border-radius:9px}
.user .tg:hover{background:var(--surface);color:var(--ink)}

/* main */
.main{padding:26px 30px 40px;max-width:1320px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.head h1{margin:0;font-size:26px;font-weight:750;letter-spacing:-.025em}
.head .sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.head-r{display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-size:13px;color:var(--muted);font-weight:550}
.chip:hover{border-color:var(--line-2)}
.bell{position:relative;width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.bell .bd{position:absolute;top:-5px;right:-5px;background:var(--neg);color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.add{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(100deg,var(--blue),var(--blue-2));color:#fff;font-weight:650;font-size:14px;padding:11px 18px;border-radius:12px;box-shadow:0 8px 22px rgba(79,124,255,.4);transition:.16s}
.add:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(79,124,255,.5)}

.panel{display:none;animation:rise .38s cubic-bezier(.2,.7,.2,1)}
.panel.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card h3{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
.card .csub{font-size:12.5px;color:var(--muted);margin:3px 0 0}
.rowbetween{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* kpi */
.kpis{grid-template-columns:1.4fr 1fr 1fr 1fr}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.kpi .kh{display:flex;align-items:center;justify-content:space-between}
.kpi .kt{font-size:13px;color:var(--muted);font-weight:550}
.kpi .kico{width:38px;height:38px;border-radius:11px;background:var(--blue-bg);color:var(--blue);display:grid;place-items:center}
.kpi.v .kico{background:var(--violet-bg);color:var(--violet)}
.kpi.g .kico{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.kpi .kv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;letter-spacing:-.03em;margin:12px 0 6px}
.kpi .kd{font-size:12.5px;color:var(--muted)}
.kpi .kd .up{color:var(--pos);font-weight:600}
.kpi .spark{position:absolute;left:0;right:0;bottom:0;height:56px;width:100%;opacity:.9}

/* donut */
.two{grid-template-columns:1fr 1.05fr}
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut{position:relative;width:190px;height:190px;flex:none}
.donut canvas{width:190px;height:190px}
.donut .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .ctr .cv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:650;font-size:17px}
.donut .ctr .cp{font-size:11px;color:var(--faint)}
.leg{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}
.leg .lr{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}
.leg .lr:last-child{border:none}
.leg .sw{width:10px;height:10px;border-radius:3px}
.leg .lv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px}
.leg .lp{font-family:var(--mono);color:var(--muted);font-size:12.5px;min-width:44px;text-align:right}

/* bars */
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;margin:18px 0 8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bars .b i{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--surface-3);transition:.2s}
.bars .b.on i{background:linear-gradient(180deg,var(--blue-soft),var(--blue));box-shadow:0 6px 16px rgba(79,124,255,.4)}
.bars .b span{font-size:11.5px;color:var(--muted)}
.bars .b.on span{color:var(--blue-soft);font-weight:600}
.topcat{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-top:6px}
.topcat .badge{display:inline-flex;align-items:center;gap:7px;background:var(--surface-3);padding:5px 11px;border-radius:9px;font-weight:600}

/* goals */
.goals4{grid-template-columns:repeat(4,1fr)}
.goal .gt{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.goal .gi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px}
.goal .gn{font-weight:600;font-size:14px}
.goal .gv{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:1px}
.pbar{height:8px;border-radius:6px;background:var(--surface-3);overflow:hidden;margin:6px 0}
.pbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--violet));transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.goal .gf{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:8px}
.goal .gf b{color:var(--muted);font-family:var(--mono)}
.pct{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--blue-soft)}

/* ai insight */
.ai{grid-template-columns:1.5fr 1fr}
.aicard{background:linear-gradient(120deg,var(--violet-bg),var(--blue-bg));border:1px solid var(--line-2);border-radius:var(--r);padding:22px;position:relative;overflow:hidden}
.aicard .brain{position:absolute;right:-10px;top:-10px;width:150px;height:150px;opacity:.16;color:var(--violet)}
.aicard .lab{display:inline-flex;align-items:center;gap:8px;color:var(--violet);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.aicard p{font-size:15px;margin:10px 0 16px;max-width:42ch;font-weight:500}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{display:flex;align-items:center;gap:9px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:13px;font-weight:550;color:var(--ink);transition:.15s}
.qa button:hover{border-color:var(--blue);color:var(--blue-soft);transform:translateY(-1px)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:0 14px 12px}
.tbl td{padding:14px;border-top:1px solid var(--line)}
.tbl td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.tbl tr:hover td{background:var(--surface-2)}
.asset{display:flex;align-items:center;gap:11px}
.tick{width:36px;height:36px;border-radius:10px;background:var(--blue-bg);color:var(--blue-soft);display:grid;place-items:center;font-weight:700;font-size:11px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.tnote{font-size:11.5px;color:var(--faint);margin-top:3px}
.btn{border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:11px;transition:.15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--blue);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(100deg,var(--blue),var(--blue-2));border:none;color:#fff;box-shadow:0 8px 20px rgba(79,124,255,.4)}

/* scenarios */
.slider{width:100%;-webkit-appearance:none;height:6px;border-radius:6px;background:var(--surface-3);outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--blue);cursor:pointer;box-shadow:0 3px 10px rgba(79,124,255,.5);transition:.1s}
.slider::-webkit-slider-thumb:hover{transform:scale(1.15)}
.field{margin-bottom:20px}
.field .fl{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:9px}
.field .fl b{font-family:var(--mono);color:var(--blue-soft)}
.proj{grid-template-columns:repeat(3,1fr);margin-top:10px}
.proj .p{background:var(--surface-2);border-radius:12px;padding:16px;text-align:center}
.proj .p .py{font-size:11px;color:var(--faint);text-transform:uppercase}
.proj .p .pm{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;margin-top:6px}

/* list items */
.list{display:flex;flex-direction:column;gap:11px}
.item{display:flex;align-items:center;gap:15px;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);transition:.15s}
.item:hover{border-color:var(--line-2)}
.grow{flex:1;min-width:0}
.item .it{font-weight:600;font-size:14px}
.mini{font-size:12.5px;color:var(--muted)}.mini b{color:var(--ink);font-family:var(--mono)}
.pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.warn{color:var(--blue-soft);background:var(--blue-bg)}
.pill.ok{color:var(--pos);background:color-mix(in srgb,var(--pos) 16%,transparent)}
.pill.due{color:var(--neg);background:color-mix(in srgb,var(--neg) 16%,transparent)}
.tag{font-size:11px;color:var(--muted);background:var(--surface-3);padding:3px 9px;border-radius:7px;margin-right:6px}

/* budgets */
.bud{margin-bottom:16px}
.bud .bt{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:7px}
.bud .track{height:9px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.bud .track i{display:block;height:100%;border-radius:6px}
.spark{width:100%;height:60px;display:block}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(2,5,12,.6);backdrop-filter:blur(5px);display:none;place-items:center;z-index:60;padding:20px}
.scrim.on{display:grid;animation:fade .2s}@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:26px;width:100%;max-width:440px;box-shadow:0 30px 90px rgba(0,0,0,.5);animation:pop .28s cubic-bezier(.2,.7,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}}
.modal h3{margin:0 0 20px;font-size:18px}
.inp{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;color:var(--ink);font-family:inherit;font-size:14px;margin-bottom:12px}
.inp:focus{border-color:var(--blue);outline:none}
.seg{display:flex;gap:7px;margin-bottom:12px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}

@media(max-width:1080px){.kpis,.two,.ai,.goals4,.proj{grid-template-columns:1fr}.goals4{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.navi{flex-direction:row;flex-wrap:wrap;flex:1}.navi button span{display:none}.premium,.user{display:none}.goals4,.kpis{grid-template-columns:1fr}}
</style>

<div class="app">
  <aside class="side">
    <div class="logo"><span class="mk">K</span><span class="nm">Kokpit<br>Finansowy</span></div>
    <nav class="navi" id="nav"></nav>
    <div class="premium">
      <div class="h"><span class="sp">✦</span> Premium Insights</div>
      <p>Otrzymuj analizy AI i rekomendacje oparte o Twoje dane.</p>
      <button class="act"><svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Aktywuj</button>
    </div>
    <div class="user"><span class="av">DS</span><div><div class="un">Darek Szuca</div><div class="ur">Ustawienia</div></div>
      <button class="tg" id="theme" aria-label="Motyw"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
  </aside>

  <main class="main">
    <div class="head">
      <div><h1 id="hTitle">Dzień dobry, Darek 👋</h1><p class="sub" id="hSub">Wszystko pod kontrolą. Twoje finanse w jednym miejscu.</p></div>
      <div class="head-r">
        <button class="chip"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> 1–30 cze 2025</button>
        <button class="bell"><svg class="i" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="bd">3</span></button>
        <button class="add" onclick="addTx()"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Dodaj transakcję</button>
      </div>
    </div>
    <div id="panels"></div>
  </main>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modalBox"></div></div>

<script>
const PLN=n=>new Intl.NumberFormat('pl-PL',{maximumFractionDigits:0}).format(Math.round(n))+' zł';
const PLN2=n=>new Intl.NumberFormat('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' zł';
const $=s=>document.querySelector(s);
const store=(k,d)=>{try{return JSON.parse(localStorage.getItem('kokpit_'+k))??d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem('kokpit_'+k,JSON.stringify(v));

let holdings=store('holdings',[
 {t:'AKC',n:'Portfel akcji GPW',q:1,px:184300,avg:150000,note:'Rebalans co kwartał',cat:'Akcje / ETF'},
 {t:'ETF',n:'ETF świat (VWCE)',q:38,px:118.4,avg:96.2,note:'DCA 500 zł/mies',cat:'Akcje / ETF'},
 {t:'BTC',n:'Bitcoin',q:0.42,px:248900,avg:181000,note:'HODL do 2028',cat:'Krypto'},
 {t:'OBL',n:'Obligacje EDO',q:1,px:96000,avg:96000,note:'',cat:'Obligacje'},
 {t:'GOT',n:'Gotówka / konto',q:1,px:41200,avg:41200,note:'Poduszka 6 mies',cat:'Gotówka'},
 {t:'NIE',n:'Mieszkanie (udział)',q:1,px:420000,avg:360000,note:'Wynajem 2 400 zł/mies',cat:'Nieruchomości'},
]);
const CAT=[['Nieruchomości','#d6a13c'],['Akcje / ETF','#34d399'],['Krypto','#f26d7d'],['Obligacje','#4f7cff'],['Gotówka','#8b96ad']];
let goals=store('goals',[
 {n:'Poduszka bezpieczeństwa',ico:'🛡️',have:41200,target:60000,mo:2000,by:'10.10.2027'},
 {n:'Wkład na dom',ico:'🏠',have:180000,target:300000,mo:4000,by:'02.02.2029'},
 {n:'Emerytura (FIRE)',ico:'🌴',have:687000,target:2000000,mo:3500,by:'12.12.2057'},
 {n:'Wakacje 2027',ico:'✈️',have:3200,target:12000,mo:800,by:'07.07.2027'},
]);
let negos=store('negos',[

/* ---------- canvas helpers ---------- */
function getVar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function genSeries(n,lo,hi){const a=[];let v=lo;for(let i=0;i<n;i++){v+=(Math.sin(i/3)+i/n)*(hi-lo)/n+(hi-lo)/n*.3;a.push(v)}a[n-1]=hi;return a}
function drawSpark(id,data,color,bars){const c=$('#'+id);if(!c)return;const dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);const mn=Math.min(...data),mx=Math.max(...data),pad=6;
  const px=i=>i/(data.length-1)*(w-pad*2)+pad,py=v=>h-pad-(v-mn)/(mx-mn||1)*(h-pad*2);
  if(bars){const bw=(w-pad*2)/data.length*.62;data.forEach((v,i)=>{const bh=(v-mn)/(mx-mn||1)*(h-pad*2)+8;x.fillStyle=color+'cc';x.beginPath();x.roundRect(px(i)-bw/2,h-pad-bh,bw,bh,4);x.fill();});return;}
  const grd=x.createLinearGradient(0,0,0,h);grd.addColorStop(0,color+'55');grd.addColorStop(1,color+'00');
  x.beginPath();data.forEach((v,i)=>x[i?'lineTo':'moveTo'](px(i),py(v)));x.lineTo(px(data.length-1),h);x.lineTo(px(0),h);x.closePath();x.fillStyle=grd;x.fill();
  x.beginPath();data.forEach((v,i)=>x[i?'lineTo':'moveTo'](px(i),py(v)));x.strokeStyle=color;x.lineWidth=2.4;x.stroke();
  const l=data.length-1;x.beginPath();x.arc(px(l),py(data[l]),3.6,0,7);x.fillStyle=color;x.fill();}

function addTx(){openModal(`<h3>Nowa transakcja</h3>

  <div style="display:flex;gap:8px;margin-top:6px"><button class="btn" style="flex:1" onclick="closeModal()">Anuluj</button><button class="btn pri" style="flex:1" onclick="saveTx()">Zapisz</button></div>`);}
function saveTx(){const n=$('#tName').value.trim(),q=+$('#tQty').value,px=+$('#tPx').value;if(!n||!q||!px)return;
  const ex=holdings.find(h=>h.n.toLowerCase()===n.toLowerCase());
  if(ex){if(txSide==='buy'){const tc=cost(ex)+q*px;ex.q+=q;ex.avg=tc/ex.q;}else ex.q=Math.max(0,ex.q-q);ex.px=px;}
  else holdings.push({t:n.slice(0,3).toUpperCase(),n,q,px,avg:px,note:'',cat:'Akcje / ETF'});
  save('holdings',holdings);closeModal();render();}
function addGoal(){openModal(`<h3>Nowy cel</h3><input class="inp" id="gName" placeholder="Nazwa (np. Wkład na dom)">
  <input class="inp num" id="gHave" type="number" placeholder="Mam już (zł)"><input class="inp num" id="gTarget" type="number" placeholder="Cel (zł)"><input class="inp num" id="gMo" type="number" placeholder="Odkładam / mies (zł)">
  <div style="display:flex;gap:8px;margin-top:6px"><button class="btn" style="flex:1" onclick="closeModal()">Anuluj</button><button class="btn pri" style="flex:1" onclick="saveGoal()">Dodaj cel</button></div>`);}
function saveGoal(){const n=$('#gName').value.trim();if(!n)return;goals.push({n,ico:'🎯',have:+$('#gHave').value||0,target:+$('#gTarget').value||1,mo:+$('#gMo').value||500,by:'—'});save('goals',goals);closeModal();render();}
function addNego(){openModal(`<h3>Nowa negocjacja</h3><input class="inp" id="nT" placeholder="Czego dotyczy"><input class="inp" id="nW" placeholder="Czego chcę"><input class="inp" id="nO" placeholder="Co oferują"><input class="inp" id="nD" placeholder="Follow-up (np. 25.08)">
  <div style="display:flex;gap:8px;margin-top:6px"><button class="btn" style="flex:1" onclick="closeModal()">Anuluj</button><button class="btn pri" style="flex:1" onclick="saveNego()">Zapisz</button></div>`);}
function saveNego(){const t=$('#nT').value.trim();if(!t)return;negos.unshift({t,want:$('#nW').value,offer:$('#nO').value,due:$('#nD').value||'—',st:'warn'});save('negos',negos);closeModal();render();}

/* theme */
$('#theme').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme')||'dark';const next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);render();};
document.documentElement.setAttribute('data-theme','dark');
render();
addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(render,150)});
</script>
