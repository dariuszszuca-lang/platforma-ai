<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rejestracja · AI Team</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1/index.css">
<style>
:root { --font-display: 'Instrument Serif', Georgia, serif; --font-body: 'Geist', ui-sans-serif, system-ui, sans-serif; }
body { margin: 0; font-family: var(--font-body); background: #f5f5f4; color: #0F1A33; -webkit-font-smoothing: antialiased; }
.font-display { font-family: var(--font-display); letter-spacing: -0.02em; }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col">

<div class="flex-1 flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <a href="/" class="flex items-center gap-3 mb-12 justify-center">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center" style="background: linear-gradient(135deg, #0F1A33 0%, #1B2A4E 100%);">
        <span class="text-white font-bold text-lg">AI</span>
      </div>
      <span class="text-2xl font-bold tracking-tight">ai team</span>
    </a>

    <div class="bg-white rounded-3xl border border-gray-200 p-8 lg:p-10">
      <h1 class="font-display text-4xl text-[#0F1A33] mb-2">Załóż konto</h1>
      <p class="text-gray-600 mb-8">Po rejestracji masz pełen dostęp do panelu z Trackerem.</p>

      <form id="signup-form" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-[#0F1A33] mb-2">Email</label>
          <input type="email" name="email" required class="w-full px-5 py-4 rounded-xl border-2 border-gray-200 focus:border-[#0F1A33] focus:outline-none text-base transition" placeholder="ty@firma.pl">
        </div>
        <div>
          <label class="block text-sm font-semibold text-[#0F1A33] mb-2">Hasło</label>
          <input type="password" name="password" required minlength="8" class="w-full px-5 py-4 rounded-xl border-2 border-gray-200 focus:border-[#0F1A33] focus:outline-none text-base transition" placeholder="min. 8 znaków">
        </div>

        <input type="hidden" name="invitation" id="invitation-input">

        <div id="error-msg" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm"></div>

        <button type="submit" class="w-full bg-[#0F1A33] hover:bg-[#1B2A4E] text-white font-bold rounded-xl py-4 text-base transition flex items-center justify-center gap-2">
          <span class="btn-text">Zarejestruj się</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>

        <p class="text-xs text-gray-500 text-center mt-6">
          Klikając „Zarejestruj się" akceptujesz <a href="/privacy.html" class="underline hover:text-[#0F1A33]">politykę prywatności</a>.
        </p>
      </form>

      <div class="mt-8 pt-6 border-t border-gray-200 text-center">
        <p class="text-sm text-gray-600">Masz już konto? <a href="/login" class="text-[#0F1A33] font-semibold hover:underline">Zaloguj się</a></p>
      </div>
    </div>

    <div id="invitation-banner" class="hidden mt-6 bg-amber-50 border border-amber-200 rounded-2xl p-4 text-center">
      <p class="text-sm text-amber-900"><strong>🎉 Witaj!</strong> Po rejestracji od razu dostajesz dostęp do <strong>Tracker P1</strong> (kupiony).</p>
    </div>
  </div>
</div>

<script>
  lucide.createIcons();

  const params = new URLSearchParams(window.location.search);
  const invite = params.get('invite');
  if (invite) {
    document.getElementById('invitation-input').value = invite;
    document.getElementById('invitation-banner').classList.remove('hidden');
  }

  const form = document.getElementById('signup-form');
  const errorMsg = document.getElementById('error-msg');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.add('hidden');
    const fd = new FormData(form);
    const body = {
      email: fd.get('email'),
      password: fd.get('password'),
      invitation: fd.get('invitation') || undefined,
    };
    try {
      const r = await fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await r.json();
      if (!r.ok) {
        errorMsg.textContent = data.error || 'Błąd rejestracji';
        errorMsg.classList.remove('hidden');
        return;
      }
      window.location.href = '/app?welcome=1';
    } catch (err) {
      errorMsg.textContent = 'Błąd połączenia. Spróbuj za chwilę.';
      errorMsg.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
