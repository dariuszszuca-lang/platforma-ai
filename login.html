<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logowanie · AI Team</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1/index.css">
<style>
:root { --font-display: 'Instrument Serif', Georgia, serif; --font-body: 'Geist', ui-sans-serif, system-ui, sans-serif; }
body { margin: 0; font-family: var(--font-body); background: #f5f5f4; color: #0F1A33; -webkit-font-smoothing: antialiased; }
.font-display { font-family: var(--font-display); letter-spacing: -0.02em; }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col">

<div class="flex-1 flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <a href="/" class="flex items-center gap-3 mb-12 justify-center">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center" style="background: linear-gradient(135deg, #0F1A33 0%, #1B2A4E 100%);">
        <span class="text-white font-bold text-lg">AI</span>
      </div>
      <span class="text-2xl font-bold tracking-tight">ai team</span>
    </a>

    <div class="bg-white rounded-3xl border border-gray-200 p-8 lg:p-10">
      <h1 class="font-display text-4xl text-[#0F1A33] mb-2">Zaloguj się</h1>
      <p class="text-gray-600 mb-8">Witaj z powrotem.</p>

      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-[#0F1A33] mb-2">Email</label>
          <input type="email" name="email" required class="w-full px-5 py-4 rounded-xl border-2 border-gray-200 focus:border-[#0F1A33] focus:outline-none text-base transition" placeholder="ty@firma.pl">
        </div>
        <div>
          <label class="block text-sm font-semibold text-[#0F1A33] mb-2">Hasło</label>
          <input type="password" name="password" required class="w-full px-5 py-4 rounded-xl border-2 border-gray-200 focus:border-[#0F1A33] focus:outline-none text-base transition" placeholder="Twoje hasło">
        </div>

        <div id="error-msg" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm"></div>

        <button type="submit" class="w-full bg-[#0F1A33] hover:bg-[#1B2A4E] text-white font-bold rounded-xl py-4 text-base transition flex items-center justify-center gap-2">
          <span>Zaloguj się</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-gray-200 text-center">
        <p class="text-sm text-gray-600">Nie masz jeszcze konta? <a href="/signup" class="text-[#0F1A33] font-semibold hover:underline">Załóż konto</a></p>
        <p class="text-xs text-gray-500 mt-3">Po zakupie Tracker P1 dostałeś mail z linkiem do rejestracji.</p>
      </div>
    </div>
  </div>
</div>

<script>
  lucide.createIcons();

  const form = document.getElementById('login-form');
  const errorMsg = document.getElementById('error-msg');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.add('hidden');
    const fd = new FormData(form);
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }),
      });
      const data = await r.json();
      if (!r.ok) {
        errorMsg.textContent = data.error || 'Błąd logowania';
        errorMsg.classList.remove('hidden');
        return;
      }
      window.location.href = '/app';
    } catch (err) {
      errorMsg.textContent = 'Błąd połączenia. Spróbuj za chwilę.';
      errorMsg.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
