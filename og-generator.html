<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>OG Image Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            padding: 40px;
        }

        .og-image {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #020203 0%, #0a0a0b 50%, #020203 100%);
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Grid pattern */
        .grid {
            position: absolute;
            inset: 0;
            background-size: 60px 60px;
            background-image:
                linear-gradient(to right, rgba(249, 115, 22, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(249, 115, 22, 0.05) 1px, transparent 1px);
            opacity: 0.8;
        }

        /* Glow effect */
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.15) 0%, transparent 70%);
            top: -200px;
            right: -100px;
        }

        .glow-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.1) 0%, transparent 70%);
            bottom: -100px;
            left: -50px;
        }

        /* Content */
        .content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 36px;
            height: 36px;
            color: white;
        }

        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 42px;
            font-weight: 700;
            color: white;
        }

        .logo-text span {
            color: #f97316;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 72px;
            font-weight: 700;
            color: white;
            line-height: 1.1;
            margin-bottom: 24px;
            max-width: 800px;
        }

        h1 span {
            background: linear-gradient(90deg, #f97316 0%, #fb923c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 28px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
            max-width: 600px;
        }

        .badge {
            position: absolute;
            bottom: 80px;
            right: 80px;
            background: rgba(249, 115, 22, 0.15);
            border: 1px solid rgba(249, 115, 22, 0.3);
            padding: 16px 32px;
            border-radius: 100px;
            color: #f97316;
            font-weight: 500;
            font-size: 20px;
        }

        /* Decorative elements */
        .dots {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            opacity: 0.3;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: #f97316;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="og-image">
        <div class="grid"></div>
        <div class="glow"></div>
        <div class="glow-2"></div>

        <div class="content">
            <div class="logo">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <div class="logo-text">AI-<span>Team</span></div>
            </div>

            <h1>Strony i systemy <span>z AI</span></h1>

            <p class="subtitle">Asystenci AI dla małych firm i freelancerów</p>
        </div>

        <div class="badge">ai-team.pl</div>
    </div>
</body>
</html>
