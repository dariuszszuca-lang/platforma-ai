  <g opacity="0.72" transform="rotate(8 1260 500)">
    <rect x="1162" y="224" width="238" height="306" rx="28" fill="#0F172A" stroke="#334155"/>
    <rect x="1194" y="262" width="98" height="18" rx="9" fill="#94A3B8"/>
    <rect x="1194" y="304" width="162" height="12" rx="6" fill="#475569"/>
