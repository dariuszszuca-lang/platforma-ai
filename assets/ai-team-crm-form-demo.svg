    <text x="224" y="160" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">Nowy klient</text>
    <text x="224" y="184" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="14">Zbierz dane do wyceny, follow-upu i dokumentów.</text>

    <text x="224" y="234" fill="#EA580C" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.8">DANE KONTAKTOWE</text>
    <path d="M224 252H976" stroke="#E5E7EB"/>

    <g font-family="Inter, Arial, sans-serif">
      <text x="224" y="292" fill="#475569" font-size="12" font-weight="800">NAZWA FIRMY</text>
      <rect x="224" y="304" width="330" height="46" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="244" y="333" fill="#94A3B8" font-size="14">Np. Firma usługowa A</text>

      <text x="584" y="292" fill="#475569" font-size="12" font-weight="800">OSOBA KONTAKTOWA</text>
