      <rect x="584" y="398" width="190" height="46" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="604" y="427" fill="#94A3B8" font-size="14">+48 ___ ___ ___</text>

      <text x="804" y="386" fill="#475569" font-size="12" font-weight="800">ŹRÓDŁO LEADU</text>
      <rect x="804" y="398" width="172" height="46" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="824" y="427" fill="#94A3B8" font-size="14">Strona WWW</text>
    </g>

    <text x="224" y="492" fill="#EA580C" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.8">PROCES I KOLEJNY KROK</text>
    <path d="M224 510H976" stroke="#E5E7EB"/>

    <g font-family="Inter, Arial, sans-serif">
      <text x="224" y="550" fill="#475569" font-size="12" font-weight="800">OBSZAR DO AUTOMATYZACJI</text>
      <rect x="224" y="562" width="330" height="46" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="244" y="591" fill="#94A3B8" font-size="14">CRM, dokumenty, follow-up...</text>

      <text x="584" y="550" fill="#475569" font-size="12" font-weight="800">STATUS</text>
      <rect x="584" y="562" width="190" height="46" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
      <text x="604" y="591" fill="#C2410C" font-size="14" font-weight="800">Do diagnozy</text>

      <text x="804" y="550" fill="#475569" font-size="12" font-weight="800">FOLLOW-UP</text>
      <rect x="804" y="562" width="172" height="46" rx="10" fill="#ECFDF5" stroke="#86EFAC"/>
