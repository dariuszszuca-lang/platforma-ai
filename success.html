<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Płatność udana! | AI-Team.pl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <style>
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(135deg, #f97316 0%, #fb923c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="text-white flex items-center justify-center p-4">
    <div class="glass rounded-3xl p-8 md:p-12 max-w-lg w-full text-center">
        <!-- Success icon -->
        <div class="w-20 h-20 mx-auto mb-6 bg-green-500/20 rounded-full flex items-center justify-center">
            <svg class="w-10 h-10 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>

        <h1 class="text-3xl font-bold mb-4">Płatność udana!</h1>

        <p class="text-gray-400 mb-6" id="plan-info">Twoje konto zostało aktywowane.</p>

        <div class="glass rounded-xl p-4 mb-8">
            <p class="text-sm text-gray-400 mb-2">Twój plan:</p>
            <p class="text-xl font-bold gradient-text" id="plan-name">Ładowanie...</p>
        </div>

        <div class="space-y-3">
            <a href="/#tools" class="block w-full py-4 bg-gradient-to-r from-orange-500 to-orange-600 text-white font-bold rounded-xl hover:shadow-[0_0_30px_rgba(249,115,22,0.4)] transition">
                Zacznij generować prompty →
            </a>
            <a href="/" class="block text-gray-400 hover:text-white transition text-sm">
                Wróć na stronę główną
            </a>
        </div>
    </div>

    <script>
        // Aktywacja kredytów na podstawie planu
        const urlParams = new URLSearchParams(window.location.search);
        const plan = urlParams.get('plan');
        const sessionId = urlParams.get('session_id');

        const planDetails = {
            starter: {
                name: 'Starter - 50 generacji',
                credits: 50,
                info: 'Masz 50 generacji do wykorzystania. Nie wygasają!'
            },
            pro: {
                name: 'Pro - Nielimitowany',
                credits: -1, // -1 = unlimited
                info: 'Masz nielimitowany dostęp do generatora. Subskrypcja odnawia się co miesiąc.'
            }
        };

        if (plan && planDetails[plan]) {
            const details = planDetails[plan];

            document.getElementById('plan-name').textContent = details.name;
            document.getElementById('plan-info').textContent = details.info;

            // Zapisz kredyty w localStorage
            const licenseData = {
                plan: plan,
                credits: details.credits,
                sessionId: sessionId,
                activatedAt: new Date().toISOString()
            };
            localStorage.setItem('promptGenLicense', JSON.stringify(licenseData));

            // Wyczyść limit darmowy
            localStorage.removeItem('promptGenUsage');
        }
    </script>
</body>
</html>
